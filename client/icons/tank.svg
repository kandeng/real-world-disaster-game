<?xml version="1.0" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><!-- viewBox re-centred on the artwork, do NOT restore "0 0 1168 1024".
     The original iconfont viewBox left the tank's ink 188.9 user units BELOW its
     centre (18.4% of the box height), so every centring layout — object-fit,
     CSS mask, <img> — drew the tank low in its frame. Measured by rasterizing
     the path and scanning ink pixels: ink bbox 60.5,387.8 1008.3x626.2, ink
     centre (564.6, 700.9), ink circumradius 535.5.
     The box below is square, centred on that ink centre to within 0.4 units,
     with a side of 2 x 541 = 1082 (circumdiameter + 1% margin), so the whole
     glyph is inscribed in the viewBox's own incircle. Any circular crop that
     contains the viewBox therefore contains the tank, with no padding needed.
     width/height follow the square viewBox to keep the intrinsic ratio 1:1 —
     a stale 228.125x200 would letterbox the square viewBox and re-introduce a
     horizontal offset. -->
