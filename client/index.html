<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Real World Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- No <link rel="preload" as="video"> here: Chrome does not support the
         'video' fetch destination, so the hint is ignored (console warning)
         and would only double-download. The intro clips are started by
         SplashOverlay.vue on the 'canplay' event. -->
</head>
<body>
    <div id="cesiumContainer"></div>

    <!-- Vue 3 application overlay -->
    <div id="app"></div>

    <!-- Cesium bootstrap loads ONLY on 3D routes (/play...). cesium-main.js
         creates the globe canvas at module scope and streams Google tiles on
         window load; on any other page (Plaza home, Account, auth callbacks)
         that canvas flashes in front of the Vue app and downloads tiles the
         page never shows. A client-side navigation to /play (SPA) imports it
         on demand via the route's beforeEnter guard in src/router/index.js;
         ESM caching keeps the single viewer a singleton across both paths. -->
    <script type="module">
      const path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (path.startsWith('/play')) {
        import('/src/cesium-main.js');
      } else {
        console.log('[cesium] skipped on non-3D route: ' + path);
      }
    </script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
