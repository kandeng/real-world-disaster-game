<!DOCTYPE html>
<!-- controller_tank_viewer.html — visual verification harness for controller_tank.js.
     Package-local page: imports the controller module from ../assets/tank/
     and tank_usa_type10.glb from the same asset directory, renders pose on a
     metres grid, and exposes the four rate
     commands as click-pulses. What to verify:
       • forward/backward: tank translates along the green nose arrow (nose =
         asset +Z; harness applies the 180 deg yaw trim the contract demands).
       • turnLeft/turnRight while stopped: pivot in place; HUD tracks go
         opposite-signed (skid steer).
       • turn while driving: curved path; tracks unequal but same-signed.
       • stop: coasts to exact rest (HUD speed/tracks 0).
       • reset: pose back to origin, heading 0. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>controller_tank.js visual harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #dfe6ec;
               font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #hud { position: fixed; top: 8px; left: 8px; padding: 8px 10px;
         background: rgba(8, 12, 16, 0.72); border: 1px solid #2c3a46; white-space: pre; }
  #pad { position: fixed; bottom: 10px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  #pad button { padding: 8px 12px; background: #1b2530; color: #dfe6ec;
                border: 1px solid #35485a; font: inherit; cursor: pointer; }
  #pad button:active { background: #2a3a4c; }
  #note { position: fixed; top: 8px; right: 8px; max-width: 340px; padding: 8px 10px;
          background: rgba(8, 12, 16, 0.72); border: 1px solid #2c3a46; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">booting…</div>
<div id="note">click = 0.7 s command pulse. nose arrow = asset +Z. grid = 1 m cells.</div>
<div id="pad">
  <button data-cmd="forward">forward</button>
  <button data-cmd="backward">backward</button>
  <button data-cmd="turnLeft">turn left</button>
  <button data-cmd="turnRight">turn right</button>
  <button data-cmd="stop">stop</button>
  <button data-cmd="reset">reset</button>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createTankController } from '../assets/tank/controller_tank.js';

const DEG2RAD = Math.PI / 180;
const GROUND_LIFT_M = 1.098;   // asset ground plane sits at y = -1.098
const PULSE_MS = 700;

const controller = createTankController({ lon: 0, lat: 0, alt: 0, headingDeg: 0 });

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x1a2026, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(30, 50, 20);
scene.add(sun);

const grid = new THREE.GridHelper(80, 80, 0x3d5468, 0x24323e);
scene.add(grid);

// Local metres frame: x = east, z = -north (three -Z faces compass north at yaw 0).
const wrapper = new THREE.Group();
scene.add(wrapper);
const noseArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 2.6, 0), 5, 0x44dd66, 1.2, 0.6);
wrapper.add(noseArrow);

new GLTFLoader().load('../assets/tank/tank_usa_type10.glb', (gltf) => {
  wrapper.add(gltf.scene);   // asset already in metres; no scale factor
}, undefined, (e) => { hud.textContent = 'LOAD ERROR: ' + (e && e.message); });

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// Click-pulse pad: command now, stop() after PULSE_MS (stop/reset immediate).
document.querySelectorAll('#pad button').forEach((b) => {
  b.addEventListener('click', () => {
    const cmd = b.dataset.cmd;
    if (cmd === 'reset') {
      location.reload();
      return;
    }
    controller[cmd]();
    if (cmd !== 'stop') setTimeout(() => controller.stop(), PULSE_MS);
  });
});

const hud = document.getElementById('hud');
let eastM = 0, northM = 0;
const origin = controller.getState().pose;

function frame(dt) {
  const s = controller.update(dt);
  // Integrate local metres from the geodesic pose for the metres-grid frame.
  const mPerDegLat = 111320;
  const mPerDegLon = mPerDegLat * Math.cos(origin.lat * DEG2RAD);
  eastM = (s.pose.lon - origin.lon) * mPerDegLon;
  northM = (s.pose.lat - origin.lat) * mPerDegLat;
  wrapper.position.set(eastM, GROUND_LIFT_M, -northM);
  wrapper.rotation.y = Math.PI - s.pose.headingDeg * DEG2RAD;  // nose +Z => trim 180
  camera.position.set(wrapper.position.x + 16, 10, wrapper.position.z + 16);
  camera.lookAt(wrapper.position.x, 1.5, wrapper.position.z);
  hud.textContent =
    'heading  ' + s.pose.headingDeg.toFixed(1).padStart(6) + ' deg\n' +
    'speed    ' + s.speed.toFixed(2).padStart(6) + ' m/s\n' +
    'yawRate  ' + s.yawRate.toFixed(2).padStart(6) + ' deg/s\n' +
    'track L  ' + s.tracks.left.toFixed(2).padStart(6) + ' m/s\n' +
    'track R  ' + s.tracks.right.toFixed(2).padStart(6) + ' m/s\n' +
    'east     ' + eastM.toFixed(2).padStart(6) + ' m\n' +
    'north    ' + northM.toFixed(2).padStart(6) + ' m';
}

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  frame(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
